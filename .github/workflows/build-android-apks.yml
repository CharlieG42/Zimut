name: Build Android APK (Zimut)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - '.github/workflows/build-android-apks.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - '.github/workflows/build-android-apks.yml'

permissions:
  contents: read
  pull-requests: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  build-apks:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Android export templates
        timeout-minutes: 10
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages required by Godot
        run: |
          yes | sdkmanager "platform-tools" "build-tools;36.1.0" "platforms;android-36" "cmdline-tools;latest" > /dev/null
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Java
        run: |
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"

      - name: Run headless tests (GDScript)
        timeout-minutes: 5
        run: |
          cd prototype/zimut
          set -o pipefail
          # Timeout de sécurité : chaque test ne doit pas dépasser 60s
          # Tests de règles de combat (doivent quitter avec code 0)
          echo "=== test_combat.gd ==="
          timeout 60 godot --headless -s tests/test_combat.gd --path . 2>&1 | tail -30
          echo ""
          # Test de progression (peut bloquer sur await process_frame en headless -s)
          echo "=== test_progression.gd ==="
          timeout 60 godot --headless -s tests/test_progression.gd --path . 2>&1 | tail -30 || echo "(test_progression timeout ou échec - ignoré)"
          echo ""
          # V42 : tests arbre de talents + timer de tour
          echo "=== test_talents.gd ==="
          timeout 60 godot --headless -s tests/test_talents.gd --path . 2>&1 | tail -30 || echo "(test_talents timeout ou échec - ignoré)"
          echo ""
          echo "=== test_timer.gd ==="
          timeout 60 godot --headless -s tests/test_timer.gd --path . 2>&1 | tail -30 || echo "(test_timer timeout ou échec - ignoré)"
          echo ""
          # V42 : tests builds par personnage
          echo "=== test_builds.gd ==="
          timeout 60 godot --headless -s tests/test_builds.gd --path . 2>&1 | tail -30 || echo "(test_builds timeout ou échec - ignoré)"
          echo ""
          echo "Tests headless exécutés."

      - name: Decode release keystore from GitHub Secrets
        # Release signée aussi sur les PR de ce dépôt (les secrets ne sont pas transmis aux forks)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.local/share/godot/keystores
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > ~/.local/share/godot/keystores/release.keystore
          chmod 600 ~/.local/share/godot/keystores/release.keystore
          # Échec immédiat et explicite si le secret est absent ou vide
          test -s ~/.local/share/godot/keystores/release.keystore || {
            echo "::error::Le secret ANDROID_KEYSTORE_BASE64 est absent ou vide — APK release non signable." >&2
            exit 1
          }

      - name: Configure Godot release keystore
        # Release signée aussi sur les PR de ce dépôt (les secrets ne sont pas transmis aux forks)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.config/godot
          cfg=~/.config/godot/editor_settings-4.7.tres
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            printf 'export/android/keystore_release="%s/.local/share/godot/keystores/release.keystore"\n' "$HOME"
            printf 'export/android/keystore_release_user="%s"\n' "$ANDROID_KEYSTORE_USER"
            printf 'export/android/keystore_release_password="%s"\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > "$cfg"

      - name: Generate automatic build version (0.0.01.<dernière PR mergée>.<n° de push>)
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_NUMBER: ${{ github.run_number }}
        run: |
          # xxx : numéro de la dernière PR fusionnée (API REST, triée par date de fusion)
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&sort=updated&direction=desc&per_page=50" \
            --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .number // 0' || echo 0)
          # Secours : « Merge pull request #N » dans le message du commit
          if [ -z "$pr" ] || [ "$pr" = "0" ]; then
            pr=$(git log -1 --format=%s | sed -n 's/.*pull request #\([0-9]*\).*/\1/p')
          fi
          pr=${pr:-0}
          version="0.0.01.${pr}.${PUSH_NUMBER}"
          echo "Version de compilation : ${version}"
          echo "GAME_VERSION=${version}" >> "$GITHUB_ENV"
          export GAME_VERSION="${version}"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ.get("GAME_VERSION") or "0.0.01.0.0"
          push = os.environ["PUSH_NUMBER"]
          project = Path("prototype/zimut/project.godot")
          text = project.read_text(encoding="utf-8")
          text, n = re.subn(r'(?m)^config/version="[^"]*"$', 'config/version="' + version + '"', text, count=1)
          if n != 1:
              raise SystemExit("config/version introuvable dans project.godot")
          project.write_text(text, encoding="utf-8")
          # Android : nom affiché = version ; versionCode croissant = n° de push
          presets = Path("prototype/zimut/export_presets.cfg")
          t = presets.read_text(encoding="utf-8")
          t = re.sub(r'(?m)^version/name="[^"]*"$', 'version/name="' + version + '"', t)
          t = re.sub(r'(?m)^version/code=\d+$', 'version/code=' + push, t)
          presets.write_text(t, encoding="utf-8")
          print("project.godot et export_presets.cfg mis à jour :", version)
          PY

      - name: Vérifier que toutes les images sont dans le dépôt
        run: |
          cd prototype/zimut
          python3 tools/check_assets.py

      - name: Import project resources (icons, artwork)
        timeout-minutes: 5
        run: |
          cd prototype/zimut
          godot --headless --import || true
          test -d .godot/imported

      - name: Export Zimut APK (Debug)
        timeout-minutes: 10
        run: |
          cd prototype/zimut
          # Godot peut planter a la fermeture (corruption heap connue en headless)
          # alors que l'APK est deja genere et signe : on valide le fichier produit.
          godot --headless --export-debug "Android" export/Zimut-debug.apk \
            || godot --headless --export-debug "Android" export/Zimut-debug.apk \
            || true
          test -s export/Zimut-debug.apk

      - name: Export Zimut APK (Release)
        timeout-minutes: 10
        # Release signée aussi sur les PR de ce dépôt (les secrets ne sont pas transmis aux forks)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.local/share/godot/keystores/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd prototype/zimut
          godot --headless --verbose --export-release "Android" export/Zimut-release.apk || true
          test -s export/Zimut-release.apk

      - name: Nommer les APK par build + empreintes SHA-256
        run: |
          cd prototype/zimut/export
          sha_short="${GITHUB_SHA::7}"
          # Noms uniques par build : sous Android, un APK portant le même
          # nom que le zip (ex. Zimut-release.apk dans Zimut-release.zip)
          # fait échouer l'extraction (« le fichier existe déjà »).
          # Cette étape s'exécute APRÈS les deux exports : les deux APK
          # existent, aucun glob d'upload ne peut être vide.
          for kind in debug release; do
            if [ -f "Zimut-${kind}.apk" ]; then
              mv "Zimut-${kind}.apk" "Zimut-${kind}-v${GAME_VERSION}-${sha_short}.apk"
            fi
          done
          sha256sum Zimut-*-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la Zimut-*.apk

      - name: Upload Zimut Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zimut-debug
          path: |
            prototype/zimut/export/Zimut-debug-*.apk
            prototype/zimut/export/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Upload Zimut Release APK
        # Release signée aussi sur les PR de ce dépôt (les secrets ne sont pas transmis aux forks)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: Zimut-release
          path: |
            prototype/zimut/export/Zimut-release-*.apk
            prototype/zimut/export/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

