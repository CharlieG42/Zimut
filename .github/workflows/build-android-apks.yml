name: Build Android APKs (Zimut & ZOE)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - 'prototype/zoe/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - 'prototype/zoe/**'

jobs:
  build-apks:
    name: Build APKs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: robherley/setup-godot@v1
        with:
          godot-version: 4.2.2

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 34
          ndk-version: 26.2.11394342
          cmake-version: 3.22.1
          accept-licenses: true

      - name: Export Zimut APK (Debug)
        run: |
          cd prototype/zimut
          godot --headless --verbose --export debug "res://export/android_debug.preset" export/Zimut-debug.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Export ZOE APK (Debug)
        run: |
          cd prototype/zoe
          godot --headless --verbose --export debug "res://export/android_debug.preset" export/ZOE-debug.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APKs
          path: |
            prototype/zimut/export/Zimut-debug.apk
            prototype/zoe/export/ZOE-debug.apk
          retention-days: 7

      - name: Export Zimut APK (Release)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          cd prototype/zimut
          godot --headless --verbose --export release "res://export/android_release.preset" export/Zimut-release.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Export ZOE APK (Release)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          cd prototype/zoe
          godot --headless --verbose --export release "res://export/android_release.preset" export/ZOE-release.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload Release APKs
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Release-APKs
          path: |
            prototype/zimut/export/Zimut-release.apk
            prototype/zoe/export/ZOE-release.apk
          retention-days: 30
