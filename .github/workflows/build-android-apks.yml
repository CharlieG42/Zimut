name: Build Android APKs (Zimut & ZOE)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - 'prototype/zoe/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - 'prototype/zoe/**'

jobs:
  build-zimut-apk:
    name: Build Zimut APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: robherley/setup-godot@v1
        with:
          godot-version: 4.2.2

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 34
          ndk-version: 26.2.11394342
          cmake-version: 3.22.1
          accept-licenses: true

      - name: Create Android debug preset for Zimut
        run: |
          cd prototype/zimut
          mkdir -p export
          
          # Create Android debug preset if it doesn't exist
          if [ ! -f export/android_debug.preset ]; then
            cat > export/android_debug.preset << 'EOF'
[preset]
name="Android Debug"
target="Android"
debug=true

[platform]
target="Android"

[android]
modules="org.godotengine.godot.GodotApp"

[android.app]
name="Zimut Iso"
package="com.charlieg42.zimut"
version_code=1
version_name="1.0"

[android.export]
target="Android"
debug=true

[android.keystore]
release=false

[android.sdk]
api_level=34
min_api_level=24
target_api_level=34

[android.arch]
arm64=true
armv7=true
x86_64=false
x86=false
EOF
          fi

      - name: Export Zimut APK (Debug)
        run: |
          cd prototype/zimut
          godot --headless --verbose --export debug "res://export/android_debug.preset" export/Zimut-debug.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload Zimut APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zimut-Debug-APK
          path: prototype/zimut/export/Zimut-debug.apk
          retention-days: 7

  build-zoe-apk:
    name: Build ZOE APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: robherley/setup-godot@v1
        with:
          godot-version: 4.2.2

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 34
          ndk-version: 26.2.11394342
          cmake-version: 3.22.1
          accept-licenses: true

      - name: Create Android debug preset for ZOE
        run: |
          cd prototype/zoe
          mkdir -p export
          
          # Create Android debug preset if it doesn't exist
          if [ ! -f export/android_debug.preset ]; then
            cat > export/android_debug.preset << 'EOF'
[preset]
name="Android Debug"
target="Android"
debug=true

[platform]
target="Android"

[android]
modules="org.godotengine.godot.GodotApp"

[android.app]
name="ZOE - Zimut"
package="com.charlieg42.zoe"
version_code=1
version_name="1.0"

[android.export]
target="Android"
debug=true

[android.keystore]
release=false

[android.sdk]
api_level=34
min_api_level=24
target_api_level=34

[android.arch]
arm64=true
armv7=true
x86_64=false
x86=false
EOF
          fi

      - name: Export ZOE APK (Debug)
        run: |
          cd prototype/zoe
          godot --headless --verbose --export debug "res://export/android_debug.preset" export/ZOE-debug.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload ZOE APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZOE-Debug-APK
          path: prototype/zoe/export/ZOE-debug.apk
          retention-days: 7

  build-release-apks:
    name: Build Release APKs
    runs-on: ubuntu-latest
    needs: [build-zimut-apk, build-zoe-apk]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot
        uses: robherley/setup-godot@v1
        with:
          godot-version: 4.2.2

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 34
          ndk-version: 26.2.11394342
          cmake-version: 3.22.1
          accept-licenses: true

      - name: Create Android release preset for Zimut
        run: |
          cd prototype/zimut
          mkdir -p export
          
          # Create Android release preset if it doesn't exist
          if [ ! -f export/android_release.preset ]; then
            cat > export/android_release.preset << 'EOF'
[preset]
name="Android Release"
target="Android"
debug=false

[platform]
target="Android"

[android]
modules="org.godotengine.godot.GodotApp"

[android.app]
name="Zimut Iso"
package="com.charlieg42.zimut"
version_code=1
version_name="1.0"

[android.export]
target="Android"
debug=false

[android.keystore]
release=true

[android.sdk]
api_level=34
min_api_level=24
target_api_level=34

[android.arch]
arm64=true
armv7=true
x86_64=false
x86=false
EOF
          fi

      - name: Export Zimut APK (Release)
        run: |
          cd prototype/zimut
          godot --headless --verbose --export release "res://export/android_release.preset" export/Zimut-release.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Create Android release preset for ZOE
        run: |
          cd prototype/zoe
          mkdir -p export
          
          # Create Android release preset if it doesn't exist
          if [ ! -f export/android_release.preset ]; then
            cat > export/android_release.preset << 'EOF'
[preset]
name="Android Release"
target="Android"
debug=false

[platform]
target="Android"

[android]
modules="org.godotengine.godot.GodotApp"

[android.app]
name="ZOE - Zimut"
package="com.charlieg42.zoe"
version_code=1
version_name="1.0"

[android.export]
target="Android"
debug=false

[android.keystore]
release=true

[android.sdk]
api_level=34
min_api_level=24
target_api_level=34

[android.arch]
arm64=true
armv7=true
x86_64=false
x86=false
EOF
          fi

      - name: Export ZOE APK (Release)
        run: |
          cd prototype/zoe
          godot --headless --verbose --export release "res://export/android_release.preset" export/ZOE-release.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Release-APKs
          path: |
            prototype/zimut/export/Zimut-release.apk
            prototype/zoe/export/ZOE-release.apk
          retention-days: 30
