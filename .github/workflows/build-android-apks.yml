name: Build Android APKs (Zimut & ZOE)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - 'prototype/zoe/**'
      - '.github/workflows/build-android-apks.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - 'prototype/zoe/**'
      - '.github/workflows/build-android-apks.yml'

env:
  GODOT_VERSION: 4.7.2

jobs:
  build-apks:
    name: Build APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages required by Godot
        run: |
          yes | sdkmanager "platform-tools" "build-tools;36.1.0" "platforms;android-36" "cmdline-tools;latest" > /dev/null
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Java and keystore
        run: |
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> "$GITHUB_ENV"
          mkdir -p ~/.local/share/godot/keystores
          keytool -genkey -v -keystore ~/.local/share/godot/keystores/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot release keystore
        run: |
          mkdir -p ~/.config/godot
          cfg=~/.config/godot/editor_settings-4.7.tres
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            printf 'export/android/keystore_release="%s/.local/share/godot/keystores/debug.keystore"\n' "$HOME"
            echo 'export/android/keystore_release_user="androiddebugkey"'
            echo 'export/android/keystore_release_password="android"'
          } > "$cfg"

      - name: Export Zimut APK (Debug)
        run: |
          cd prototype/zimut
          godot --headless --export-debug "Android" export/Zimut-debug.apk \
            || godot --headless --export-debug "Android" export/Zimut-debug.apk

      - name: Export ZOE APK (Debug)
        run: |
          cd prototype/zoe
          godot --headless --export-debug "Android Debug" export/ZOE-debug.apk \
            || godot --headless --export-debug "Android Debug" export/ZOE-debug.apk

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APKs
          path: |
            prototype/zimut/export/Zimut-debug.apk
            prototype/zoe/export/ZOE-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Export Zimut APK (Release)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.local/share/godot/keystores/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: cd prototype/zimut && godot --headless --verbose --export-release "Android" export/Zimut-release.apk

      - name: Export ZOE APK (Release)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.local/share/godot/keystores/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: cd prototype/zoe && godot --headless --verbose --export-release "Android Release" export/ZOE-release.apk

      - name: Upload Release APKs
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Release-APKs
          path: |
            prototype/zimut/export/Zimut-release.apk
            prototype/zoe/export/ZOE-release.apk
          retention-days: 30
          if-no-files-found: error
