name: Build Android APKs (Zimut & ZOE)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - 'prototype/zoe/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'prototype/zimut/**'
      - 'prototype/zoe/**'

jobs:
  build-apks:
    name: Build APKs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Godot 4.2.2
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
          sudo mv Godot_v4.2.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cd ~/.local/share/godot/export_templates
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          unzip Godot_v4.2.2-stable_export_templates.tpz
          # Move templates to correct location
          if [ -d "Godot_v4.2.2-stable_export_templates" ]; then
            mv Godot_v4.2.2-stable_export_templates 4.2.2.stable
          fi
          ls -la 4.2.2.stable/

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 34
          ndk-version: 26.2.11394342
          cmake-version: 3.22.1
          accept-licenses: true

      - name: Setup Java and keystore
        run: |
          mkdir -p ~/.android
          # Create debug keystore
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          # Set environment variables for Godot
          echo "GODOT_ANDROID_EXPORT_TEMPLATES=$HOME/.local/share/godot/export_templates" >> $GITHUB_ENV
          echo "ANDROID_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> $GITHUB_ENV

      - name: Export Zimut APK (Debug)
        run: |
          cd prototype/zimut
          godot --headless --verbose --export-debug "Android" export/Zimut-debug.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GODOT_ANDROID_EXPORT_TEMPLATES: ${{ env.GODOT_ANDROID_EXPORT_TEMPLATES }}
          ANDROID_DEBUG_KEYSTORE: ${{ env.ANDROID_DEBUG_KEYSTORE }}

      - name: Export ZOE APK (Debug)
        run: |
          cd prototype/zoe
          godot --headless --verbose --export-debug "Android Debug" export/ZOE-debug.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GODOT_ANDROID_EXPORT_TEMPLATES: ${{ env.GODOT_ANDROID_EXPORT_TEMPLATES }}
          ANDROID_DEBUG_KEYSTORE: ${{ env.ANDROID_DEBUG_KEYSTORE }}

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Debug-APKs
          path: |
            prototype/zimut/export/Zimut-debug.apk
            prototype/zoe/export/ZOE-debug.apk
          retention-days: 7

      - name: Export Zimut APK (Release)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          cd prototype/zimut
          godot --headless --verbose --export-release "Android" export/Zimut-release.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GODOT_ANDROID_EXPORT_TEMPLATES: ${{ env.GODOT_ANDROID_EXPORT_TEMPLATES }}
          ANDROID_DEBUG_KEYSTORE: ${{ env.ANDROID_DEBUG_KEYSTORE }}

      - name: Export ZOE APK (Release)
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          cd prototype/zoe
          godot --headless --verbose --export-release "Android Release" export/ZOE-release.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          GODOT_ANDROID_EXPORT_TEMPLATES: ${{ env.GODOT_ANDROID_EXPORT_TEMPLATES }}
          ANDROID_DEBUG_KEYSTORE: ${{ env.ANDROID_DEBUG_KEYSTORE }}

      - name: Upload Release APKs
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Release-APKs
          path: |
            prototype/zimut/export/Zimut-release.apk
            prototype/zoe/export/ZOE-release.apk
          retention-days: 30
