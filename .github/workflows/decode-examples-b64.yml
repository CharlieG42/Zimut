name: Decode base64 assets (Examples)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Examples/**'

permissions:
  contents: write

concurrency:
  group: decode-examples-b64
  cancel-in-progress: false

jobs:
  decode:
    name: Décoder les .b64 d'Examples en fichiers binaires
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Décoder tous les fichiers .b64
        run: |
          shopt -s globstar nullglob
          nb=0
          for f in Examples/**/*.b64; do
            out="${f%.b64}"
            if base64 -d -- "$f" > "$out"; then
              nb=$((nb+1))
              echo "Décodé : ${f} -> ${out}"
            else
              echo "::error::Échec du décodage : ${f}"
              exit 1
            fi
          done
          echo "${nb} fichier(s) .b64 traité(s)."

      - name: Empreintes MD5 des binaires décodés (audit)
        run: |
          find Examples -type f \( -name '*.jpg' -o -name '*.png' \) -print0 | xargs -0 -r md5sum

      - name: Committer les fichiers décodés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Examples
          if git diff --cached --quiet; then
            echo "Rien à committer : les binaires sont déjà à jour."
            exit 0
          fi
          git commit -m "Décodage automatique des assets base64 d'Examples [skip ci]"
          git push
