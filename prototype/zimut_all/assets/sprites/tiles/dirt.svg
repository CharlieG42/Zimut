<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Waven style: square dirt tile (rotated -45 degrees by Cell to look isometric) -->
  <rect width="100" height="100" fill="#8B6F47"/>
  <!-- Texture variations -->
  <rect x="0" y="0" width="50" height="50" fill="#9A7B52" opacity="0.5"/>
  <rect x="50" y="50" width="50" height="50" fill="#7A5F3B" opacity="0.4"/>
  <!-- Pebble details -->
  <circle cx="20" cy="30" r="2" fill="#A08963"/>
  <circle cx="60" cy="20" r="2.5" fill="#6B5335"/>
  <circle cx="80" cy="55" r="2" fill="#A08963"/>
  <circle cx="35" cy="70" r="2.5" fill="#6B5335"/>
  <circle cx="70" cy="85" r="2" fill="#A08963"/>
  <circle cx="15" cy="85" r="2" fill="#6B5335"/>
  <!-- Cracks -->
  <path d="M40,10 q3,10 0,20 q-3,10 0,18" stroke="#6B5335" stroke-width="1.5" fill="none"/>
  <path d="M75,30 q-8,5 -12,14" stroke="#6B5335" stroke-width="1.5" fill="none"/>
  <path d="M20,55 q10,3 15,12" stroke="#6B5335" stroke-width="1.5" fill="none"/>
</svg>
